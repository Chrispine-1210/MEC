name: Aothothe PR10 runner probe

on:
  push:
    branches:
      - verification/aothothe-pr10

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Runner health
        run: echo MEC_RUNNER_OK

  private-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact private Aothothe head
        uses: actions/checkout@v4
        with:
          repository: Chrispine-1210/aothothe-enterprise-os
          ref: 0bfd81e13429a117b9351c215b7432c1aeea99bf
          token: ${{ github.token }}
      - name: Confirm exact source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "0bfd81e13429a117b9351c215b7432c1aeea99bf"
          echo AOTHOTHE_CROSS_REPO_CHECKOUT_OK
